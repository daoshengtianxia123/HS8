name: PIC14 LLVM Cloud CI

on:
  push:
    branches: [pic14-cloud-test]
  workflow_dispatch:

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout LLVM 23.1.0
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-23.1.0
          path: llvm-project
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Apply real PIC14 backend overlay
        run: python3 ci/apply_pic14_real_codegen.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Complete PIC14 Triple support
        run: python3 ci/fix_pic14_triple.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Complete PIC14 MCAsmInfo includes
        run: python3 ci/fix_pic14_mc_asm_info.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Fix PIC14 CodeGenOptLevel include
        run: python3 ci/fix_pic14_codegenopt_include.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Fix PIC14 TargetFrameLowering API
        run: python3 ci/fix_pic14_frame_lowering_api.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Fix PIC14 SelectionDAG API
        run: python3 ci/fix_pic14_isel_api.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Fix PIC14 RegisterInfo generated API
        run: python3 ci/fix_pic14_reginfo_api.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Fix PIC14 AsmPrinter operand handling
        run: python3 ci/fix_pic14_asmprinter_operand.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Enable PIC14 M2 single-u8 argument lowering
        run: python3 ci/enable_pic14_m2_arg_return.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Enable PIC14 M2 three-u8 argument lowering
        run: python3 ci/enable_pic14_m2_add3.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Enable PIC14 M2 byte logic lowering
        run: python3 ci/enable_pic14_m2_logic.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Enable PIC14 M2 expression-pressure lowering
        run: python3 ci/enable_pic14_m2_expr_pressure.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Install PIC14 lit regressions
        run: |
          mkdir -p llvm-project/llvm/test/CodeGen/PIC14
          cp tests/CodeGen/PIC14/*.ll llvm-project/llvm/test/CodeGen/PIC14/

      - name: Configure LLVM
        run: |
          cmake -S llvm-project/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=PIC14

      - name: Build PIC14 components, llc and lit helpers
        run: |
          cmake --build llvm-build --target \
            PIC14CommonTableGen LLVMPIC14Info LLVMPIC14Desc LLVMPIC14CodeGen \
            llc FileCheck count not llvm-config -j4

      - name: PIC14 real M1 llc acceptance
        run: |
          cat > ret42.ll <<'EOF'
          target triple = "pic14-unknown-none"

          define i8 @answer() {
          entry:
            ret i8 42
          }
          EOF
          llvm-build/bin/llc -enable-new-pm=0 -march=pic14 -mcpu=pic16f687 \
            -filetype=asm ret42.ll -o ret42.s
          cat ret42.s
          grep -Eq 'retlw[[:space:]]+42' ret42.s

      - name: PIC14 lit FileCheck regressions
        run: |
          llvm-build/bin/llvm-lit -v \
            llvm-project/llvm/test/CodeGen/PIC14

      - name: Reject enhanced-midrange instructions in F687 core
        run: |
          if grep -R -En '\b(MOVIW|MOVWI|ADDFSR|FSR0|FSR1|INDF0|INDF1)\b' \
              llvm-project/llvm/lib/Target/PIC14; then
            echo "Enhanced-midrange instruction/state leaked into PIC16F687 backend"
            exit 1
          fi

      - name: Show generated PIC14 files
        if: always()
        run: |
          find llvm-build -name 'PIC14Gen*.inc' -print | sort || true
