name: PIC14 LLVM Cloud CI

on:
  push:
    branches: [pic14-cloud-test]
  workflow_dispatch:

jobs:
  tablegen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout LLVM 23.1.0
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-23.1.0
          path: llvm-project
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Apply PIC14 overlay
        run: python3 ci/apply_pic14.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Complete PIC14 Triple bootstrap support
        run: python3 ci/fix_pic14_triple.py "$GITHUB_WORKSPACE/llvm-project"

      - name: Configure LLVM
        run: |
          cmake -S llvm-project/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=PIC14

      - name: Build PIC14 components and llc
        run: |
          cmake --build llvm-build --target \
            PIC14CommonTableGen LLVMPIC14Info LLVMPIC14Desc LLVMPIC14CodeGen llc -j4

      - name: PIC14 M1 llc acceptance
        run: |
          cat > ret42.ll <<'EOF'
          target triple = "pic14-unknown-none"

          define i8 @answer() {
          entry:
            ret i8 42
          }
          EOF
          llvm-build/bin/llc -march=pic14 -mcpu=pic16f687 -filetype=asm ret42.ll -o ret42.s
          cat ret42.s
          grep -Eq 'retlw[[:space:]]+42' ret42.s

      - name: Show generated PIC14 files
        if: always()
        run: |
          find llvm-build -name 'PIC14Gen*.inc' -print | sort || true
